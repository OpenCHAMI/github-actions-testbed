name: scorecard
on:
  branch_protection_rule:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '39 5 * * 1'

permissions:
  contents: read

jobs:
  check:
    permissions:
      contents: read          # baseline for checkout
      security-events: write  # SARIF upload to GHAS
      id-token: write         # publish results to the OpenSSF dashboard
    uses: OpenCHAMI/github-actions/.github/workflows/scorecard.yml@ec67a926c858892c2e5e18fed111d7a7720384f3 # github-actions under test (seantronsen/feat/refactor-gpg-chain-verify)

  scorecard:
    if: ${{ always() }}
    needs: [check]
    runs-on: ubuntu-slim
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with: { jobs: "${{ toJSON(needs) }}" }
