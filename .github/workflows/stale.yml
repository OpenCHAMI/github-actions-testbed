name: stale
on:
  schedule:
    - cron: '23 3 * * *'  # daily at 03:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    uses: OpenCHAMI/github-actions/.github/workflows/stale.yml@ce924a777ca3efdd577e4e81d2819a1f14260935 # github-actions under test (seantronsen/feat/release-attestation)
    permissions:
      issues: write          # label, comment on, and close stale issues
      pull-requests: write   # label, comment on, and close stale PRs
