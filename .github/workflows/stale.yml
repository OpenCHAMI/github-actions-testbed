name: stale
on:
  schedule:
    - cron: '23 3 * * *'  # daily at 03:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    uses: OpenCHAMI/github-actions/.github/workflows/stale.yml@049945791f1739f6ce69c8f1c4e36abe4e647f50 # github-actions under test (seantronsen/feat/release-attestation)
    permissions:
      issues: write          # label, comment on, and close stale issues
      pull-requests: write   # label, comment on, and close stale PRs
