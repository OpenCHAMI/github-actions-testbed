name: stale
on:
  schedule:
    - cron: '23 3 * * *'  # daily at 03:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    uses: OpenCHAMI/github-actions/.github/workflows/stale.yml@33d24d11aec767a3e5e0f99655510c79497ecced # github-actions under test (seantronsen/feat/makefile-drift-avoidance)
    permissions:
      issues: write          # label, comment on, and close stale issues
      pull-requests: write   # label, comment on, and close stale PRs
