name: govulncheck
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    uses: OpenCHAMI/github-actions/.github/workflows/govulncheck.yml@9aa4f9e5a010d45cec4d108baacd1cdcb2aef40e # github-actions under test (seantronsen/feat/sarif-govulncheck)
    permissions:
      contents: read
      security-events: write  # SARIF upload to GHAS

  govulncheck:
    if: ${{ always() }}
    needs: [check]
    runs-on: ubuntu-slim
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with: { jobs: "${{ toJSON(needs) }}" }
