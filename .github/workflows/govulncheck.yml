name: govulncheck
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '23 3 * * *'  # daily at 03:23 UTC

permissions:
  contents: read

jobs:
  check:
    uses: OpenCHAMI/github-actions/.github/workflows/govulncheck.yml@520a0c83084a83434de4188d669ea58d7bde9ef2 # github-actions under test (seantronsen/feat/sarif-govulncheck)
    permissions:
      contents: read          # baseline for checkout
      security-events: write  # SARIF upload to GHAS

  govulncheck:
    if: ${{ always() }}
    needs: [check]
    runs-on: ubuntu-slim
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with: { jobs: "${{ toJSON(needs) }}" }
