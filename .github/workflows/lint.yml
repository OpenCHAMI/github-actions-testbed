name: lint

# All linters under one gate: the `lint` job is the required status check.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '23 3 * * *'  # daily at 03:23 UTC

permissions:
  contents: read

jobs:
  lint-go:
    uses: OpenCHAMI/github-actions/.github/workflows/lint-go.yml@1c84ed734369d9a454e1b8443147fa738fadd648 # github-actions under test (seantronsen/feat/release-attestation)
    with:
      go-version-file: go.mod

  lint-ci:
    uses: OpenCHAMI/github-actions/.github/workflows/lint-ci.yml@1c84ed734369d9a454e1b8443147fa738fadd648 # github-actions under test (seantronsen/feat/release-attestation)
    permissions:
      contents: read          # baseline for checkout
      security-events: write  # zizmor SARIF upload to GHAS

  lint-renovate:
    uses: OpenCHAMI/github-actions/.github/workflows/lint-renovate.yml@1c84ed734369d9a454e1b8443147fa738fadd648 # github-actions under test (seantronsen/feat/release-attestation)

  # Disabled: lint-codegen-fabrica runs the caller's `make generate-check`, which
  # now depends on OpenCHAMI/github-actions#68 and RFD OpenCHAMI/roadmap#143.
  # lint-codegen-fabrica:
  #   uses: OpenCHAMI/github-actions/.github/workflows/lint-codegen-fabrica.yml@ede12aa9179dd5dad6869133a63656b8d3b07974 # github-actions under test (seantronsen/fix/codegen-lint, PR 51)
  #   with:
  #     go-version-file: go.mod

  lint-docs:
    uses: OpenCHAMI/github-actions/.github/workflows/lint-docs.yml@facd9cde80f73c4833a455c764dea59cc87cc0de # github-actions under test (seantronsen/feat/sarif-govulncheck)
    permissions:
      contents: read          # baseline for checkout
      pull-requests: read     # list the PR's changed files
      security-events: write  # SARIF upload to GHAS
      issues: write           # broken-links issue on the default branch

  lint:
    if: ${{ always() }}
    needs: [lint-go, lint-ci, lint-renovate, lint-docs]  # lint-codegen-fabrica: disabled, see above
    runs-on: ubuntu-slim
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with: { jobs: "${{ toJSON(needs) }}" }
