name: lint

# All linters under one gate: the `lint` job is the required status check.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-go:
    uses: OpenCHAMI/github-actions/.github/workflows/lint-go.yml@33d24d11aec767a3e5e0f99655510c79497ecced # github-actions under test (seantronsen/feat/makefile-drift-avoidance)
    with:
      go-version-file: go.mod

  lint-ci:
    uses: OpenCHAMI/github-actions/.github/workflows/lint-ci.yml@33d24d11aec767a3e5e0f99655510c79497ecced # github-actions under test (seantronsen/feat/makefile-drift-avoidance)
    permissions:
      contents: read          # baseline for checkout
      security-events: write  # zizmor SARIF upload to GHAS

  lint-renovate:
    uses: OpenCHAMI/github-actions/.github/workflows/lint-renovate.yml@33d24d11aec767a3e5e0f99655510c79497ecced # github-actions under test (seantronsen/feat/makefile-drift-avoidance)

  lint:
    if: ${{ always() }}
    needs: [lint-go, lint-ci, lint-renovate]
    runs-on: ubuntu-slim
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with: { jobs: "${{ toJSON(needs) }}" }
