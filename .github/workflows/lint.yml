name: lint

# All linters under one gate: the `lint` job is the required status check.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-go:
    uses: OpenCHAMI/github-actions/.github/workflows/lint-go.yml@e8e8c4966a61aac37a200c53c670ce58146cdfbf # github-actions under test (seantronsen/feat/redesign-deployment)
    with:
      go-version-file: go.mod

  lint-ci:
    uses: OpenCHAMI/github-actions/.github/workflows/lint-ci.yml@e8e8c4966a61aac37a200c53c670ce58146cdfbf # github-actions under test (seantronsen/feat/redesign-deployment)
    permissions:
      contents: read          # baseline for checkout
      security-events: write  # zizmor SARIF upload to GHAS

  lint:
    if: ${{ always() }}
    needs: [lint-go, lint-ci]
    runs-on: ubuntu-slim
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with: { jobs: "${{ toJSON(needs) }}" }
