name: build

# Build check: GoReleaser snapshot build of everything, publishing nothing,
# then package validation. The `build` job is the required status check.

on:
  pull_request:

permissions:
  contents: read

jobs:
  goreleaser:
    uses: OpenCHAMI/github-actions/.github/workflows/build-check-goreleaser.yml@5b8f3decfae1c29ef4004a6f49f1593d25eccc95 # github-actions under test (seantronsen/feat/redesign-deployment)
    with:
      go-version-file: go.mod

  validate:
    needs: goreleaser
    uses: OpenCHAMI/github-actions/.github/workflows/validate-packages.yml@5b8f3decfae1c29ef4004a6f49f1593d25eccc95 # github-actions under test (seantronsen/feat/redesign-deployment)
    with:
      packages: |
        - name: testbed-quadlet*.rpm
          files:
            - /etc/openchami
            - /etc/openchami/configs
            - /etc/openchami/configs/testbed.yaml
            - /usr/share/containers/systemd/testbed.container
            - /usr/share/containers/systemd/testbed.container.d
            - /usr/share/containers/systemd/testbed.container.d/10-defaults.conf
            - /usr/share/licenses/testbed-quadlet
            - /usr/share/licenses/testbed-quadlet/MIT.txt
        - name: testbed-quadlet*.deb
          files:
            - /etc/openchami/configs/testbed.yaml
            - /usr/share/containers/systemd/testbed.container
            - /usr/share/containers/systemd/testbed.container.d/10-defaults.conf
            - /usr/share/doc/testbed-quadlet/copyright

  build:
    if: ${{ always() }}
    needs: [goreleaser, validate]
    runs-on: ubuntu-slim
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with: { jobs: "${{ toJSON(needs) }}" }
