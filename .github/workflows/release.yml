name: release

# PR images and releases; build-release-goreleaser picks the mode from the
# event:
# - pull_request: pushes ghcr.io/openchami/github-actions-testbed:pr-<N>.
# - v* tag push: semver images, packages, draft release, then validation and
#   signing in parallel, signatures attached, then publish. Safe to tag freely:
#   nothing depends on this repo.

on:
  pull_request:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  goreleaser:
    permissions:
      contents: write      # release creation, uploading assets
      packages: write      # image push, container provenance
      id-token: write      # Sigstore signing (attest-build-provenance)
      attestations: write  # build provenance attestations
    uses: OpenCHAMI/github-actions/.github/workflows/build-release-goreleaser.yml@63343e072647ea9a2ad016b6ea9726e655eb3292 # github-actions under test (seantronsen/feat/release-attestation)
    with:
      go-version-file: go.mod

  trivy:
    # Scans the images named in .goreleaser.yaml (testbed and testbed-alt) at
    # this run's tag (pr-<N> on PRs); fork PRs push nothing, so nothing matches.
    needs: goreleaser
    uses: OpenCHAMI/github-actions/.github/workflows/trivy-image-scan.yml@3f4837668325e804c057a415e108d1393af3406a # github-actions under test (seantronsen/feat/decouple-trivy)
    permissions:
      contents: read          # baseline for checkout
      packages: read          # read image versions
      security-events: write  # SARIF upload to GHAS
    with:
      exit-code: '0'

  validate:
    # PR builds produce no packages (they're validated in build.yml).
    if: ${{ github.event_name == 'push' }}
    needs: goreleaser
    uses: OpenCHAMI/github-actions/.github/workflows/validate-packages.yml@63343e072647ea9a2ad016b6ea9726e655eb3292 # github-actions under test (seantronsen/feat/release-attestation)
    with:
      packages: |
        - name: testbed-quadlet*
          files:
            - /etc/openchami/configs/testbed.yaml
            - /usr/share/containers/systemd/testbed.container
            - /usr/share/containers/systemd/testbed.container.d/10-defaults.conf
          rpm-files:
            - /usr/share/licenses/testbed-quadlet/MIT.txt
          deb-files:
            - /usr/share/doc/testbed-quadlet/copyright
        # Per-arch binary package; `[-_][0-9]` keeps it from matching testbed-quadlet.
        - name: testbed[-_][0-9]*
          files:
            - /usr/bin/testbed
          rpm-files:
            - /usr/share/licenses/testbed/MIT.txt
          deb-files:
            - /usr/share/doc/testbed/copyright

  sign:
    if: ${{ github.event_name == 'push' }}
    needs: goreleaser
    uses: OpenCHAMI/github-actions/.github/workflows/gpg-sign-artifacts.yml@63343e072647ea9a2ad016b6ea9726e655eb3292 # github-actions under test (seantronsen/feat/release-attestation)
    secrets:
      repo-cert-key: ${{ secrets.GPG_REPO_CERT_KEY_B64 }}
      master-public-key: ${{ secrets.MASTER_PUBLIC_ASC }}
      master-fingerprint: ${{ secrets.MASTER_FPR }}

  release-modify:
    needs: sign
    permissions:
      contents: write   # edit the draft GitHub Release and upload files
    uses: OpenCHAMI/github-actions/.github/workflows/release-modify.yml@63343e072647ea9a2ad016b6ea9726e655eb3292 # github-actions under test (seantronsen/feat/release-attestation)
    with:
      notes: ${{ needs.sign.outputs.release-notes }}
      files-artifact-name: release-signatures

  publish:
    if: ${{ github.event_name == 'push' }}
    needs: [validate, release-modify]
    permissions:
      contents: write   # publish the draft GitHub Release
    uses: OpenCHAMI/github-actions/.github/workflows/release-publish.yml@63343e072647ea9a2ad016b6ea9726e655eb3292 # github-actions under test (seantronsen/feat/release-attestation)
