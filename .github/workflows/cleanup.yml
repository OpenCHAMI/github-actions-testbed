name: cleanup

# Deletes the pr-<N> images named in .goreleaser.yaml (testbed and
# testbed-alt) when a PR closes.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read   # checkout, to read .goreleaser.yaml
  packages: write  # delete image versions

jobs:
  cleanup:
    uses: OpenCHAMI/github-actions/.github/workflows/pr-registry-cleanup.yml@ec67a926c858892c2e5e18fed111d7a7720384f3 # github-actions under test (seantronsen/feat/refactor-gpg-chain-verify)
