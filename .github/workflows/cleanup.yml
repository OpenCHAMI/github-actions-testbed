name: cleanup

# Deletes the pr-<N> images when a PR closes.

on:
  pull_request:
    types: [closed]

permissions:
  packages: write

jobs:
  cleanup:
    uses: OpenCHAMI/github-actions/.github/workflows/pr-registry-cleanup.yml@e8e8c4966a61aac37a200c53c670ce58146cdfbf # github-actions under test (seantronsen/feat/redesign-deployment)
