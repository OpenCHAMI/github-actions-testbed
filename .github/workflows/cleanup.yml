name: cleanup

# Deletes the pr-<N> images named in .goreleaser.yaml (testbed and
# testbed-alt) when a PR closes.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read   # checkout, to read .goreleaser.yaml
  packages: write  # delete image versions

jobs:
  cleanup:
    uses: OpenCHAMI/github-actions/.github/workflows/pr-registry-cleanup.yml@5ce950505544262010e3b293b561964278ef6031 # github-actions under test (seantronsen/feat/makefile-drift-avoidance)
