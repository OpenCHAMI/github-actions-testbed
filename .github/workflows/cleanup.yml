name: cleanup

# Deletes the pr-<N> images named in .goreleaser.yaml (testbed and
# testbed-alt) when a PR closes.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read   # checkout, to read .goreleaser.yaml
  packages: write  # delete image versions

jobs:
  cleanup:
    uses: OpenCHAMI/github-actions/.github/workflows/pr-registry-cleanup.yml@ce924a777ca3efdd577e4e81d2819a1f14260935 # github-actions under test (seantronsen/feat/release-attestation)
