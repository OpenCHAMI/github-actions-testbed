name: cleanup

# Deletes the pr-<N> images when a PR closes.

on:
  pull_request:
    types: [closed]

permissions:
  packages: write

jobs:
  cleanup:
    uses: OpenCHAMI/github-actions/.github/workflows/pr-registry-cleanup.yml@ebefc849e9e8069cf53b97e7fdd4b4ac8d3c2067 # github-actions under test (seantronsen/feat/redesign-deployment)
